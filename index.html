<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화랑 FC</title>
  <link rel="icon" type="image/svg+xml" href="./assets/hwarang-logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F6F6F4; font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; color: #141414; -webkit-font-smoothing: antialiased; }
    a { color: #C71F10; text-decoration: none; }
    a:hover { color: #E53B1F; }
    label input, label select { font-weight: 600; }
    /* 검색으로 걸러지는 "없음" 안내: data-show가 true일 때만 보인다 */
    #memberEmpty, #pickEmpty { display: none; }
    #memberEmpty[data-show="true"], #pickEmpty[data-show="true"] { display: block; }
  </style>
</head>
<body>
<div id="app"></div>

<!-- 화면 템플릿 (Claude Design "Hwarang Home.dc.html" 이식본).
     {{ 경로 }} = app.js renderVals() 값 / <sc-for> 반복 / <sc-if> 조건 / on* = 이벤트 핸들러 -->
<template id="tpl">
<div style="min-height:100vh; background:#F6F6F4; padding-bottom:{{ ui.bottomPad }};">

  <div data-screen-label="헤더" style="position:sticky; top:0; z-index:100; background:#FFFFFF; border-bottom:1px solid #EAEAE6;">
    <div style="max-width:1120px; margin:0 auto; padding:{{ ui.headPad }}; display:flex; align-items:center; gap:24px;">
      <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:0;">
        <img src="assets/hwarang-logo.svg" alt="화랑 FC" style="width:{{ ui.logo }}; height:{{ ui.logo }}; display:block;">
        <div>
          <div style="font-size:{{ ui.title }}; font-weight:800; letter-spacing:-.3px; line-height:1.15;">화랑 FC</div>
          <div style="font-size:12px; color:#8A6D1F; font-weight:700; letter-spacing:.4px;">since 2010</div>
        </div>
      </div>
      <div style="display:{{ ui.topTabs }}; gap:4px; align-self:stretch;">
        <sc-for list="{{ tabs }}" as="t">
          <div onClick="{{ t.onClick }}" style="display:flex; align-items:center; padding:0 18px; cursor:pointer; font-size:15px; font-weight:{{ t.weight }}; color:{{ t.color }}; border-bottom:3px solid {{ t.bar }}; margin-bottom:-1px;">{{ t.label }}</div>
        </sc-for>
      </div>
    </div>
  </div>

  <sc-if value="{{ flash }}">
  <div style="max-width:1120px; margin:0 auto; padding:{{ ui.mainPad }};">
    <div onClick="{{ closeFlash }}" style="background:#141414; color:#FFFFFF; border-radius:12px; padding:13px 16px; font-size:14px; font-weight:700; cursor:pointer;">{{ flash }}</div>
  </div>
  </sc-if>

  <sc-if value="{{ showNotice }}">
  <div style="max-width:1120px; margin:0 auto; padding:{{ ui.mainPad }};">
    <div style="background:#FFFFFF; border:1px solid #EAEAE6; border-radius:16px; padding:28px 18px; text-align:center;">
      <div style="font-size:15px; font-weight:800;">{{ notice.title }}</div>
      <div style="font-size:13px; color:#5F5F5F; margin-top:6px; line-height:1.5;">{{ notice.text }}</div>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ homeReady }}">
  <div data-screen-label="홈" style="max-width:1120px; margin:0 auto; padding:{{ ui.mainPad }}; display:grid; grid-template-columns:{{ ui.homeCols }}; grid-template-areas:{{ ui.homeAreas }}; gap:{{ ui.gap }}; align-items:start;">

    <div style="grid-area:a; display:flex; flex-direction:column; gap:{{ ui.gap }}; min-width:0;">

      <div style="background:#FFFFFF; border:1px solid #EAEAE6; border-radius:16px; overflow:hidden;">
        <div style="padding:{{ ui.cardPad }};">
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <span style="background:#C71F10; color:#FFFFFF; font-size:13px; font-weight:800; padding:4px 10px; border-radius:8px; letter-spacing:.3px;">{{ next.dday }}</span>
            <span style="font-size:13px; font-weight:700; color:#5F5F5F;">다가오는 경기</span>
            <sc-if value="{{ next.hasOpp }}">
              <span style="font-size:13px; font-weight:800; color:#141414; background:#F6F0DC; padding:4px 10px; border-radius:8px;">vs {{ next.opponent }}</span>
            </sc-if>
          </div>
          <div style="display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-top:14px;">
            <span style="font-size:{{ ui.heroDate }}; font-weight:800; letter-spacing:-1px; line-height:1;">{{ next.date }}</span>
            <span style="font-size:18px; font-weight:700; color:#141414;">{{ next.time }}</span>
          </div>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; padding-top:14px; border-top:1px solid #F0EFEB;">
            <div style="min-width:0;">
              <div style="font-size:16px; font-weight:800;">{{ next.venue }}</div>
              <div style="font-size:13px; color:#5F5F5F; margin-top:3px;">{{ next.address }}</div>
            </div>
            <div onClick="{{ toggleMap }}" style="flex-shrink:0; min-height:40px; padding:0 14px; display:flex; align-items:center; gap:6px; border-radius:10px; border:1.5px solid #E2E1DC; font-size:13px; font-weight:800; cursor:pointer; color:#141414;">{{ mapLabel }}</div>
          </div>
          <sc-if value="{{ mapOpen }}">
            <div id="venueMap" data-lat="{{ next.lat }}" data-lng="{{ next.lng }}" data-address="{{ next.address }}" data-name="{{ next.venue }}" style="margin-top:12px; height:{{ ui.mapH }}; border-radius:12px; overflow:hidden; background:#EEEDE8; border:1px solid #E2E1DC;"></div>
          </sc-if>
          <div style="display:grid; grid-template-columns:{{ next.navCols }}; gap:8px; margin-top:12px;">
            <sc-for list="{{ next.navApps }}" as="n">
              <a href="{{ n.href }}" target="{{ n.target }}" rel="noopener" onClick="{{ n.onClick }}" style="min-height:44px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:#F6F6F4; color:#141414; font-size:13px; font-weight:800;">{{ n.label }}</a>
            </sc-for>
          </div>
          <sc-if value="{{ canShare }}">
            <div onClick="{{ shareKakao }}" style="margin-top:8px; min-height:44px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:#FEE500; color:#191600; font-size:13px; font-weight:800; cursor:pointer;">카톡방에 참석 투표 올리기</div>
          </sc-if>
        </div>

        <div style="padding:{{ ui.cardPad }}; border-top:1px solid #F0EFEB; background:#FFFFFF;">
          <sc-if value="{{ noIdentity }}">
            <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
              <div style="flex:1; min-width:200px;">
                <div style="font-size:15px; font-weight:800;">내 참석 여부</div>
                <div style="font-size:13px; color:#5F5F5F; margin-top:3px;">처음 한 번만 명단에서 내 이름을 골라주세요. 이 기기에 저장돼요.</div>
              </div>
              <div onClick="{{ openPicker }}" style="min-height:48px; padding:0 22px; display:flex; align-items:center; justify-content:center; border-radius:12px; cursor:pointer; font-size:15px; font-weight:800; background:#141414; color:#FFFFFF;">내 이름 선택하기</div>
            </div>
          </sc-if>
          <sc-if value="{{ rsvpCollapsed }}">
            <div style="display:flex; align-items:center; gap:10px;">
              <span style="font-size:13px; font-weight:800; padding:5px 11px; border-radius:8px; background:{{ myChip.bg }}; color:{{ myChip.fg }};">{{ myChip.label }}</span>
              <span style="flex:1; min-width:0; font-size:14px; font-weight:700;">{{ myName }}님 응답 완료</span>
              <span onClick="{{ openRsvp }}" style="font-size:13px; font-weight:800; color:#C71F10; cursor:pointer; padding:8px 0 8px 8px;">변경</span>
            </div>
          </sc-if>
          <sc-if value="{{ rsvpExpanded }}">
            <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
              <span style="font-size:15px; font-weight:800;">{{ myName }}님 참석 여부 <span onClick="{{ openPicker }}" style="font-size:13px; font-weight:700; color:#5F5F5F; margin-left:6px; cursor:pointer; text-decoration:underline;">본인 변경</span></span>
              <span style="font-size:13px; color:#5F5F5F;">경기 당일까지 변경 가능</span>
            </div>
            <div style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px;">
              <sc-for list="{{ rsvpButtons }}" as="b">
                <div onClick="{{ b.onClick }}" style="min-height:50px; display:flex; align-items:center; justify-content:center; border-radius:12px; cursor:pointer; font-size:15px; font-weight:800; background:{{ b.bg }}; color:{{ b.color }}; border:1.5px solid {{ b.bd }};">{{ b.label }}</div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </div>

      <div style="background:#FFFFFF; border:1px solid #EAEAE6; border-radius:16px; padding:{{ ui.cardPad }};">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
          <span style="font-size:16px; font-weight:800;">참석 현황</span>
          <span style="font-size:13px; font-weight:800; padding:5px 10px; border-radius:8px; background:{{ quorum.bg }}; color:{{ quorum.fg }};">{{ quorum.label }}</span>
        </div>
        <div style="display:flex; align-items:baseline; gap:6px; margin-top:12px;">
          <span style="font-size:48px; font-weight:800; color:#C71F10; line-height:1; letter-spacing:-1px;">{{ cnt.attend }}</span>
          <span style="font-size:15px; font-weight:800;">명 참석</span>
          <span style="font-size:13px; color:#5F5F5F;">/ 전체 {{ cnt.total }}명{{ cnt.guestNote }}</span>
        </div>
        <div style="position:relative; margin-top:14px;">
          <div style="display:flex; height:12px; border-radius:6px; overflow:hidden; background:#EFEFEB;">
            <div style="width:{{ bar.attend }}; background:#C71F10;"></div>
            <div style="width:{{ bar.maybe }}; background:#D8C07A;"></div>
            <div style="width:{{ bar.absent }}; background:#A8A8A2;"></div>
          </div>
          <div style="position:absolute; top:-4px; bottom:-4px; left:{{ bar.minPos }}; width:2px; background:#141414; border-radius:1px;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:10px; font-size:13px; color:#5F5F5F;">
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#C71F10;"></span>참석 {{ cnt.attend }}</span>
            <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#D8C07A;"></span>미정 {{ cnt.maybe }}</span>
            <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#A8A8A2;"></span>불참 {{ cnt.absent }}</span>
            <span style="display:flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:#EFEFEB; border:1px solid #DDDCD6;"></span>미응답 {{ cnt.none }}</span>
          </div>
          <span style="font-weight:700; color:#141414;">| 최소 {{ minPlayers }}명</span>
        </div>
        <div style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-top:14px;">
          <div onClick="{{ toggleRoster }}" style="min-height:44px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:#F6F6F4; font-size:13px; font-weight:800; cursor:pointer;">{{ rosterLabel }}</div>
          <div onClick="{{ openGuest }}" style="min-height:44px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:#F6F0DC; color:#3D2F08; font-size:13px; font-weight:800; cursor:pointer;">용병 추가</div>
        </div>
        <sc-if value="{{ guestFormOpen }}">
          <div style="margin-top:10px; padding:12px; border-radius:12px; background:#F6F0DC;">
            <div style="font-size:13px; font-weight:700; color:#3D2F08;">{{ myName }}님이 데려오는 용병 이름을 넣어 주세요.</div>
            <div style="display:flex; gap:8px; margin-top:8px;">
              <input id="gf-name" value="{{ guestForm.name }}" onKeydown="{{ onGuestKey }}" maxlength="12" placeholder="용병 이름" style="flex:1; min-width:0; padding:11px 12px; border-radius:10px; border:1.5px solid #D8C07A; background:#FFFFFF; font-family:inherit; font-size:15px; font-weight:600; color:#141414; outline:none;">
              <div onClick="{{ saveGuest }}" style="flex-shrink:0; min-height:44px; padding:0 16px; display:flex; align-items:center; border-radius:10px; cursor:pointer; font-size:14px; font-weight:800; background:#141414; color:#FFFFFF;">추가</div>
              <div onClick="{{ cancelGuest }}" style="flex-shrink:0; min-height:44px; padding:0 12px; display:flex; align-items:center; border-radius:10px; cursor:pointer; font-size:14px; font-weight:800; background:#FFFFFF; color:#141414; border:1.5px solid #D8C07A;">취소</div>
            </div>
            <sc-if value="{{ guestForm.error }}">
              <div style="font-size:13px; font-weight:700; color:#A3190B; margin-top:8px;">{{ guestForm.error }}</div>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ rosterOpen }}">
          <div style="display:flex; flex-direction:column; gap:14px; margin-top:14px;">
            <sc-for list="{{ groups }}" as="g">
              <div style="display:grid; grid-template-columns:{{ ui.groupCols }}; gap:{{ ui.groupGap }}; align-items:start;">
                <span style="font-size:13px; font-weight:800; color:{{ g.color }}; padding-top:5px;">{{ g.label }} {{ g.n }}</span>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                  <sc-for list="{{ g.names }}" as="p">
                    <span onClick="{{ p.onClick }}" style="cursor:{{ p.cursor }}; font-size:14px; padding:5px 11px; border-radius:9px; background:{{ p.bg }}; color:{{ p.fg }}; font-weight:{{ p.weight }}; border:1px solid {{ p.bd }};">{{ p.name }}</span>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>

    <div style="grid-area:f; background:#FFFFFF; border:1px solid #EAEAE6; border-radius:16px; padding:{{ ui.cardPad }}; min-width:0;">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <span style="font-size:16px; font-weight:800;">이번 경기 포메이션</span>
        <span onClick="{{ goFormation }}" style="font-size:13px; font-weight:800; color:#C71F10; cursor:pointer;">전체 보기</span>
      </div>
      <div style="margin-top:12px; padding:12px 14px; border-radius:12px; background:{{ mySummary.bg }}; display:flex; gap:10px; align-items:baseline;">
        <span style="font-size:13px; font-weight:800; color:{{ mySummary.labelFg }}; flex-shrink:0;">내 포지션</span>
        <span style="font-size:14px; font-weight:700; color:{{ mySummary.fg }};">{{ mySummary.text }}</span>
      </div>
      <div style="display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; margin-top:12px;">
        <sc-for list="{{ qButtons }}" as="q">
          <div onClick="{{ q.onClick }}" style="position:relative; min-height:44px; display:flex; align-items:center; justify-content:center; border-radius:10px; cursor:pointer; font-size:14px; font-weight:800; background:{{ q.bg }}; color:{{ q.fg }}; border:1.5px solid {{ q.bd }};">{{ q.label }}<span style="position:absolute; top:6px; right:7px; width:6px; height:6px; border-radius:50%; background:{{ q.dot }};"></span></div>
        </sc-for>
      </div>
      <div style="margin:12px auto 0; max-width:{{ ui.pitchMaxHome }};">
        <div style="position:relative; width:100%; aspect-ratio:68 / 100; border-radius:12px; overflow:hidden; background:repeating-linear-gradient(180deg, #2F6B45 0 10%, #2B6440 10% 20%);">
          <div style="position:absolute; inset:3.5%; border:2px solid rgba(255,255,255,.5); border-radius:2px;"></div>
          <div style="position:absolute; left:3.5%; right:3.5%; top:50%; height:2px; margin-top:-1px; background:rgba(255,255,255,.5);"></div>
          <div style="position:absolute; left:50%; top:50%; width:26%; aspect-ratio:1; transform:translate(-50%,-50%); border:2px solid rgba(255,255,255,.5); border-radius:50%;"></div>
          <div style="position:absolute; left:28%; right:28%; top:3.5%; height:14%; border:2px solid rgba(255,255,255,.5); border-top:none;"></div>
          <div style="position:absolute; left:28%; right:28%; bottom:3.5%; height:14%; border:2px solid rgba(255,255,255,.5); border-bottom:none;"></div>
          <sc-for list="{{ pitchSlots }}" as="s">
            <div style="position:absolute; left:{{ s.x }}; top:{{ s.y }}; transform:translate(-50%,-50%); display:flex; align-items:center; gap:4px; padding:4px 8px 4px 6px; border-radius:999px; white-space:nowrap; background:{{ s.bg }}; color:{{ s.fg }}; border:1.5px {{ s.bdStyle }} {{ s.bd }}; box-shadow:{{ s.shadow }};">
              <span style="font-size:12px; font-weight:800; color:{{ s.posFg }};">{{ s.pos }}</span>
              <span style="font-size:12px; font-weight:800;">{{ s.name }}</span>
            </div>
          </sc-for>
        </div>
      </div>
      <sc-if value="{{ formationEmpty }}">
        <div style="margin-top:12px; text-align:center; font-size:13px; color:#5F5F5F;">아직 포메이션이 없어요. 운영진이 경기 전날까지 올려요.</div>
      </sc-if>
    </div>

    <div style="grid-area:u; background:#FFFFFF; border:1px solid #EAEAE6; border-radius:16px; padding:{{ ui.cardPad }}; min-width:0;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:16px; font-weight:800;">이후 일정</span>
        <span onClick="{{ goSchedule }}" style="font-size:13px; font-weight:800; color:#C71F10; cursor:pointer;">전체 일정</span>
      </div>
      <div style="display:flex; flex-direction:column; margin-top:6px;">
        <sc-for list="{{ upcoming }}" as="u">
          <div style="display:grid; grid-template-columns:64px minmax(0,1fr); gap:12px; align-items:center; padding:12px 0; border-top:{{ u.bt }};">
            <div>
              <div style="font-size:18px; font-weight:800; letter-spacing:-.5px;">{{ u.date }}</div>
              <div style="font-size:12px; color:#5F5F5F; font-weight:700;">{{ u.dow }}</div>
            </div>
            <div style="min-width:0;">
              <div style="font-size:14px; font-weight:800;">{{ u.venue }}</div>
              <div style="font-size:13px; color:#5F5F5F; margin-top:2px;">{{ u.meta }}</div>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{ upcomingEmpty }}">
          <div style="font-size:13px; color:#5F5F5F; padding:14px 0 4px;">등록된 이후 일정이 없어요.</div>
        </sc-if>
      </div>
    </div>

  </div>
  </sc-if>

  <sc-if value="{{ fmReady }}">
  <div data-screen-label="포메이션" style="max-width:1120px; margin:0 auto; padding:{{ ui.mainPad }}; display:flex; flex-direction:column; gap:{{ ui.gap }};">

    <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;">
      <div>
        <div style="font-size:{{ ui.pageTitle }}; font-weight:800; letter-spacing:-.5px;">포메이션</div>
        <div style="font-size:13px; color:#5F5F5F; margin-top:4px;">{{ next.date }} {{ next.time }} · {{ next.venue }} · 참석 {{ cnt.attend }}명 · 4-2-3-1</div>
      </div>
      <sc-if value="{{ isAdmin }}"><span style="font-size:13px; font-weight:800; color:#6E5513; background:#F6F0DC; padding:6px 12px; border-radius:8px;">운영진 · 편집 가능</span></sc-if>
    </div>

    <div style="display:grid; grid-template-columns:{{ ui.fmCols }}; gap:{{ ui.gap }}; align-items:start;">

      <div style="display:flex; flex-direction:column; gap:{{ ui.gap }}; min-width:0;">
        <div style="background:#FFFFFF; border:1px solid #EAEAE6; border-radius:16px; padding:{{ ui.cardPad }};">
          <div style="font-size:13px; font-weight:800; color:#5F5F5F;">{{ myLabel }}</div>
          <div style="font-size:17px; font-weight:800; margin-top:6px; color:{{ mySummary.fg2 }};">{{ mySummary.text }}</div>
          <div style="display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; margin-top:12px;">
            <sc-for list="{{ myQuarters }}" as="m">
              <div style="border-radius:10px; padding:9px 4px; text-align:center; background:{{ m.bg }}; color:{{ m.fg }};">
                <div style="font-size:12px; font-weight:700; color:{{ m.sub }};">{{ m.q }}</div>
                <div style="font-size:15px; font-weight:800; margin-top:2px;">{{ m.pos }}</div>
              </div>
            </sc-for>
          </div>
        </div>

        <div style="background:#FFFFFF; border:1px solid #EAEAE6; border-radius:16px; padding:{{ ui.cardPad }};">
          <div style="display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px;">
            <sc-for list="{{ qButtons }}" as="q">
              <div onClick="{{ q.onClick }}" style="position:relative; min-height:46px; display:flex; align-items:center; justify-content:center; border-radius:10px; cursor:pointer; font-size:15px; font-weight:800; background:{{ q.bg }}; color:{{ q.fg }}; border:1.5px solid {{ q.bd }};">{{ q.label }}<span style="position:absolute; top:6px; right:7px; width:6px; height:6px; border-radius:50%; background:{{ q.dot }};"></span></div>

  <sc-if value="{{ pickerOpen }}">
    <div data-screen-label="이름 선택" onClick="{{ closePicker }}" style="position:fixed; inset:0; z-index:200; background:rgba(20,20,20,.45); display:flex; align-items:flex-end; justify-content:center;">
      <div onClick="{{ stop }}" style="width:100%; max-width:560px; max-height:82vh; background:#FFFFFF; border-radius:18px 18px 0 0; display:flex; flex-direction:column;">
        <div style="padding:18px 20px 12px; border-bottom:1px solid #F0EFEB;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:17px; font-weight:800;">내 이름 선택</div>
            <div onClick="{{ closePicker }}" style="width:36px; height:36px; border-radius:50%; background:#F3F3F0; color:#5F5F5F; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; cursor:pointer;">×</div>
          </div>
          <div style="font-size:13px; color:#5F5F5F; margin-top:4px;">선택한 이름은 이 기기에 저장돼요. 다른 사람 이름은 고르지 말아주세요.</div>
          <sc-if value="{{ pickerNote }}">
            <div style="font-size:13px; font-weight:800; color:#A3190B; margin-top:6px;">{{ pickerNote }}</div>
          </sc-if>
          <input onInput="{{ onQuery }}" placeholder="이름 검색" style="width:100%; margin-top:12px; padding:12px 14px; border-radius:12px; border:1.5px solid #E2E1DC; background:#F6F6F4; font-family:'Pretendard'; font-size:15px; outline:none;">
        </div>
        <div style="overflow-y:auto; padding:14px 20px 24px; display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px;">
          <sc-for list="{{ pickList }}" as="p">
            <div data-pick="{{ p.key }}" onClick="{{ p.onClick }}" style="min-height:48px; display:flex; align-items:center; justify-content:center; border-radius:12px; cursor:pointer; font-size:15px; font-weight:700; background:{{ p.bg }}; color:{{ p.fg }}; border:1.5px solid {{ p.bd }};">{{ p.name }}</div>
          </sc-for>
          <div id="pickEmpty" data-show="{{ pickEmpty }}" style="grid-column:1 / -1; text-align:center; font-size:13px; color:#5F5F5F; padding:20px 0;">명단에 없는 이름이에요. 운영진에게 등록을 요청해주세요.</div>
        </div>
      </div>
    </div>
  </sc-if>

  <div style="display:{{ ui.bottomTabs }}; position:fixed; bottom:0; left:0; right:0; z-index:100; background:#FFFFFF; border-top:1px solid #EAEAE6;">
    <sc-for list="{{ tabs }}" as="t">
      <div onClick="{{ t.onClick }}" style="flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:10px 4px calc(12px + env(safe-area-inset-bottom)); cursor:pointer;">
        <span style="width:20px; height:3px; border-radius:2px; background:{{ t.bar }};"></span>
        <span style="font-size:13px; font-weight:{{ t.weight }}; color:{{ t.color }};">{{ t.label }}</span>
      </div>
    </sc-for>
  </div>

</div>
</template>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="./config.js"></script>
<script src="./renderer.js"></script>
<script src="./app.js"></script>
</body>
</html>
